<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PechosLatinos 🔥</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #020617, #0f172a);
    color: white;
}

header {
    text-align: center;
    padding: 60px 20px;
}

h1 {
    font-size: 3em;
    color: #22c55e;
}

p {
    font-size: 1.2em;
}

.btn {
    display: inline-block;
    margin-top: 20px;
    padding: 15px 25px;
    background: #22c55e;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

.section {
    padding: 50px 20px;
    text-align: center;
}

.card {
    background: #1e293b;
    margin: 20px auto;
    padding: 25px;
    border-radius: 12px;
    max-width: 600px;
}

/* GALERÍA */
.gallery {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.gallery img {
    width: 250px;
    border-radius: 12px;
    transition: 0.3s;
    cursor: pointer;
}

.gallery img:hover {
    transform: scale(1.05);
    opacity: 0.8;
}
</style>
</head>

<body>

<header>
    <h1>🔥 PechosLatinos</h1>
    <p>Comunidad +18 latina</p>

    <a class="btn" href="https://reddit.com/r/PechosLatinos" target="_blank">
        Entrar al subreddit
    </a>
</header>

<div class="section">
    <div class="card">
        <h2>Preview</h2>

        <!-- GALERÍA (FUNCIONANDO) -->
        <div class="gallery">
            <img src="https://b.jpg">
            <img src="https://b1.jpg">
            
        </div>

        <p>Más contenido dentro del subreddit 🔥</p>
    </div>
</div>

</body>
</html>
